[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-init]
command=sh -c "touch /var/www/html/database/database.sqlite && chown www-data:www-data /var/www/html/database/database.sqlite && php /var/www/html/artisan migrate --force && php /var/www/html/artisan config:cache && php /var/www/html/artisan route:cache && php /var/www/html/artisan view:cache"
command_backoff=0
autorestart=false
startretries=1
